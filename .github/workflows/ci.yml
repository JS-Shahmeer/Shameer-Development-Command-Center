name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dcc
          POSTGRES_PASSWORD: dcc
          POSTGRES_DB: dcc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://dcc:dcc@localhost:5432/dcc_test
      DIRECT_URL: postgresql://dcc:dcc@localhost:5432/dcc_test
      AUTH_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm prisma migrate deploy
      - run: pnpm test:integration
      - run: pnpm build
